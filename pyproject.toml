[project]
name = "ai-elderly-companion"
version = "0.1.0"
description = "AI companion app for elderly users: chat, medication tracking, dementia support, and scam protection, with family kept in the loop."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
